<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>약국 AI 접객 v0.5</title>
<style>body{font:17px -apple-system,sans-serif;background:#eef5f8;color:#17344a;margin:0}main{max-width:680px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:16px;margin:12px 0}video{width:100%;height:260px;object-fit:cover;background:#111;border-radius:12px}button{font-size:16px;padding:12px;margin:4px;border:0;border-radius:9px;background:#087db6;color:white}#result{font-size:26px;font-weight:700}small{color:#555}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><main><h2>약국 AI 음성 접객 v0.5 — 테스트</h2><section><p id="status">관리자 시작 대기</p><video id="video" autoplay muted playsinline></video><p id="result">손님 대기 중</p><p id="heard">고객용 버튼은 없습니다.</p></section>
<section><b>관리자 전용</b><p><button id="start">운영 시작 / 권한 허용</button><button id="stop">중지</button><button id="reset">복구</button></p><details><summary>관리자 진단</summary><button id="voice">음성 시험</button><button id="mic">음성 인식 시험</button><pre id="log"></pre></details></section>
<small>시연용입니다. 카메라의 영상 변화로 방문을 추정하며 사람 자체를 식별하지 않습니다. 음성 인식은 iPad Safari 지원 여부에 따라 작동하지 않을 수 있습니다. 실제 환자 정보는 입력하지 마세요. 카메라·음성은 서버에 저장하지 않습니다. Safari를 화면에 띄운 상태로 유지하세요.</small></main><canvas id="cv" width="64" height="48" hidden></canvas>
<script>
const $=id=>document.getElementById(id);let stream,timer,prev,busy=false,on=false,last=0,rec;
function status(s){$('status').textContent=s;$('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent}
function say(t,done=()=>{}){if(!window.speechSynthesis){status('음성 합성 미지원');done();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.92;let finished=false;const finish=()=>{if(finished)return;finished=true;done()};u.onend=finish;u.onerror=finish;speechSynthesis.speak(u);setTimeout(finish,Math.max(5000,t.length*200))}
function classify(t){if(/응급|119|쓰러|의식|호흡|숨을|출혈|피가|다쳤/.test(t))return 'urgent';if(/처방|조제|약 타|약타/.test(t))return 'rx';if(/구매|사러|감기약|파스|주세요|약 하나/.test(t))return 'buy';return 'unknown'}
function respond(k,t){const label={rx:'처방 조제',buy:'일반의약품 구매',urgent:'응급 의심',unknown:'약사 확인 필요'};const msg={rx:'처방전 조제 때문에 오셨군요. 약사님이 잠시 후 도와드리겠습니다.',buy:'약을 구매하러 오셨군요. 약사님이 도와드리겠습니다.',urgent:'약사님, 긴급한 도움이 필요한 손님입니다. 바로 확인해 주세요. 위급한 경우 119에 연락하세요.',unknown:'정확히 이해하지 못했습니다. 약사님이 직접 도와드리겠습니다.'};$('result').textContent=label[k];$('heard').textContent=t?'고객: '+t:'';status('분류 완료 · 응답');say(msg[k],()=>{busy=false;status(on?'카메라 감지 중':'시연 완료')})}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('Safari 음성 인식 API 미지원');busy=false;return}let heard=false;rec=new SR();rec.lang='ko-KR';rec.continuous=false;rec.onresult=e=>{heard=true;let t=e.results[0][0].transcript;respond(classify(t),t)};rec.onerror=e=>{status('음성 인식 오류: '+e.error);busy=false};rec.onend=()=>{if(!heard&&busy){busy=false;status('음성 미감지 · 대기')}};try{rec.start();status('고객 음성 듣는 중')}catch(e){busy=false;status('인식 시작 실패: '+e.message)}}
function greet(){if(busy)return;busy=true;$('result').textContent='손님 감지';status('접근 움직임 감지');say('안녕하세요. 어서 오세요. 무엇을 도와드릴까요?',listen)}
function scan(){if(!on||busy||$('video').readyState<2)return;let c=$('cv'),x=c.getContext('2d',{willReadFrequently:true});x.drawImage($('video'),0,0,64,48);let d=x.getImageData(0,0,64,48).data,now=[];for(let i=0;i<d.length;i+=16)now.push((d[i]+d[i+1]+d[i+2])/3);if(prev){let diff=0;for(let i=0;i<now.length;i++)diff+=Math.abs(now[i]-prev[i]);if(diff/now.length>17&&Date.now()-last>15000){last=Date.now();greet()}}prev=now}
async function start(){if(on)return;if(!isSecureContext||!navigator.mediaDevices?.getUserMedia){status('HTTPS 및 카메라 API 필요');return}try{status('카메라·마이크 권한 요청');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});$('video').srcObject=stream;await $('video').play();on=true;prev=null;status('카메라·마이크 켜짐 · 감지 중');timer=setInterval(scan,400)}catch(e){status('장치 오류: '+e.name+' '+e.message)}}
function stop(){on=false;clearInterval(timer);try{rec?.abort()}catch(e){}if(window.speechSynthesis)speechSynthesis.cancel();stream?.getTracks().forEach(t=>t.stop());$('video').srcObject=null;busy=false;status('중지')}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=()=>{stop();start()};$('voice').onclick=()=>say('안녕하세요. 어서 오세요. 무엇을 도와드릴까요?');$('mic').onclick=()=>{busy=true;listen()};
</script></body></html>
