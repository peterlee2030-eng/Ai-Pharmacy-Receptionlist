<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>약국 AI 로봇 v0.9</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#254759}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e5fbfa,#eaf0ff 55%,#fff2f6)}main{max-width:850px;margin:auto;padding:20px 20px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:850;font-size:20px;color:#248b90}.pill{font-size:13px;background:#fff;padding:9px 14px;border-radius:50px;color:#49848b}.stage{margin-top:18px;background:rgba(255,255,255,.85);border-radius:32px;box-shadow:0 20px 65px #639eaf28;text-align:center;padding:20px 20px 26px;overflow:hidden}.welcome{font-size:clamp(24px,5vw,36px);margin:10px 0 0}.sub{color:#71929d;margin:8px 0 14px}.robot-wrap{height:clamp(265px,46vh,430px);display:grid;place-items:center}.robot{position:relative;width:245px;height:230px;animation:float 3.6s ease-in-out infinite}.antenna{position:absolute;top:-23px;left:119px;width:8px;height:35px;background:#64bfc5;border-radius:10px}.antenna:before{content:"";position:absolute;top:-12px;left:-9px;width:26px;height:26px;background:#ffb3c7;border-radius:50%;box-shadow:0 0 0 8px #ffdbe7}.ear{position:absolute;top:80px;width:38px;height:80px;border-radius:22px;background:#65bbc5}.ear.left{left:-24px}.ear.right{right:-24px}.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#d9f5f7);border:9px solid #79cbd2;border-radius:85px;box-shadow:inset 0 -13px 18px #b1e5e9,0 15px 0 #b4dce0}.eyes{display:flex;justify-content:space-around;margin:76px 36px 0}.eye{width:26px;height:43px;background:#294b68;border-radius:50%;animation:blink 6s infinite;box-shadow:inset 5px 5px #fff8}.cheek{position:absolute;top:140px;width:35px;height:17px;border-radius:50%;background:#ffb6c7;opacity:.8}.cheek.left{left:27px}.cheek.right{right:27px}.mouth{position:absolute;left:50%;top:149px;transform:translateX(-50%);width:38px;height:17px;border:5px solid #44758b;border-top:0;border-radius:0 0 35px 35px}.robot.talking .mouth{height:31px;width:28px;background:#ef8da8;border:4px solid #44758b;border-radius:50%;animation:talk .28s infinite alternate}.robot.listening .ear{animation:listenGlow 1s infinite alternate}.robot.listening .eyes{transform:scale(1.07)}.robot.waiting .eye{animation:blink 6s infinite}.speech{font-size:clamp(18px,3.2vw,25px);font-weight:750;min-height:32px;color:#246b7b}.heard{margin-top:12px;color:#5e8591;min-height:25px}.bottom{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}.preview{width:126px;height:95px;object-fit:cover;border-radius:17px;background:#183d50;transform:scaleX(-1);border:3px solid white;box-shadow:0 5px 15px #0002}.state{font-size:13px;color:#698e96}.admin{margin-top:18px;background:#ffffffd9;border-radius:18px;padding:12px 16px}summary{cursor:pointer;font-weight:700;color:#497480}button{border:0;border-radius:11px;background:#278e9c;color:white;font-size:15px;padding:11px 15px;margin:6px 4px 2px 0}button:active{transform:scale(.98)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:170px;overflow:auto}small{display:block;margin-top:14px;color:#68828d;line-height:1.5}@keyframes float{50%{transform:translateY(-12px)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}@keyframes talk{to{height:12px;width:38px}}@keyframes listenGlow{to{background:#ffb1d4;box-shadow:0 0 25px #ffb1d4}}@media(max-width:460px){main{padding:12px}.stage{padding:16px 12px}.robot{transform:scale(.88)}.robot-wrap{height:280px}}@media(prefers-reduced-motion:reduce){.robot,.eye,.mouth,.ear{animation:none!important}}</style></head><body><main><header class="top"><div class="brand">✚ 약국 AI 안내 로봇</div><div class="pill">🌿 친절한 음성 안내</div></header><section class="stage"><h1 class="welcome">어서 오세요! 💗</h1><p class="sub">편하게 말씀해 주세요. 제가 도와드릴게요.</p><div class="robot-wrap"><div id="robot" class="robot waiting" role="img" aria-label="웃는 얼굴의 약국 안내 로봇"><div class="antenna"></div><div class="ear left"></div><div class="ear right"></div><div class="face"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="cheek left"></div><div class="cheek right"></div><div class="mouth"></div></div></div></div><div class="speech" id="result">손님을 기다리고 있어요</div><div class="heard" id="heard">카메라 앞에 오시면 먼저 인사드려요.</div><div class="bottom"><video id="video" class="preview" autoplay muted playsinline aria-label="작은 카메라 미리보기"></video><div id="status" class="state">관리자 시작 대기</div></div></section><section class="admin"><details><summary>⚙ 관리자 전용 · 설정 및 진단</summary><p><button id="start">운영 시작 / 권한 허용</button><button id="stop">중지</button><button id="reset">복구</button></p><details><summary>진단 도구</summary><button id="voice">음성 시험</button><button id="mic">음성 인식 시험</button><pre id="log"></pre></details></details></section><small>v0.9 시연용 · 카메라 움직임 감지(사람 식별 아님) · 실제 환자 개인정보 입력 금지 · iPad Safari 화면을 켜 두세요.</small></main><canvas id="cv" width="64" height="48" hidden></canvas><script>

const $=id=>document.getElementById(id);
let stream=null,timer=null,rec=null,on=false,phase='idle',prev=null,motion=0,lastGreeting=0,turns=0,session=0,listenTimeout=null,voiceTimeout=null,armedAt=0,frames=0;
function setMood(m){$('robot').className='robot '+m}
function status(s){$('status').textContent=s;$('log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('log').textContent.slice(0,2200)}
function label(s){$('result').textContent=s}
function cleanupSpeech(){clearTimeout(listenTimeout);if(rec){const r=rec;rec=null;r.onend=null;r.onerror=null;r.onresult=null;try{r.abort()}catch(e){}}}
function say(t,cb=()=>{}){setMood('talking');phase='speaking';status('음성 응답: '+t);if(!window.speechSynthesis){status('음성 합성 미지원');cb();return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.93;let done=false;const finish=()=>{if(done)return;done=true;clearTimeout(voiceTimeout);cb()};u.onend=finish;u.onerror=e=>{status('음성 출력 오류: '+e.error);finish()};speechSynthesis.speak(u);voiceTimeout=setTimeout(finish,Math.max(5500,t.length*210))}
function classify(t){let x=t.replace(/\s/g,'');if(/응급|119|쓰러|의식|호흡|숨을|출혈|피가|다쳤|가슴이아파/.test(x))return 'urgent';if(/안녕|계세요|계신가요|누구|여보세요|저기요|약사님|직원|사람있/.test(x))return 'staff';if(/처방|조제|약타|처방전/.test(x))return 'rx';if(/구매|사러|감기약|파스|주세요|약하나|약좀|일반약|두통약/.test(x))return 'buy';if(/고마|감사|됐어요|괜찮아요|안녕히|잘있/.test(x))return 'bye';return 'unknown'}
function standby(){if(!on)return;cleanupSpeech();phase='idle';setMood('waiting');turns=0;motion=0;prev=null;armedAt=Date.now();label('손님 대기 중');status('카메라 ON · 다음 손님 대기')}
function answer(t){if(!on)return;turns++;$('heard').textContent='고객: '+t;let k=classify(t);const texts={staff:'약사님을 찾으시는군요. 잠시만 기다려 주세요.',rx:'처방전 조제 때문에 오셨군요. 약사님이 도와드리겠습니다.',buy:'약을 구매하러 오셨군요. 약사님이 도와드리겠습니다.',urgent:'긴급한 도움이 필요한 손님입니다. 약사님, 바로 확인해 주세요. 위급하면 119에 연락하세요.',bye:'감사합니다. 안녕히 가세요.',unknown:'말씀하신 내용을 정확히 이해하지 못했어요. 처방전 조제, 약 구매, 약사님 호출 중 어떤 도움이 필요하신가요?'};label({staff:'약사 호출',rx:'처방전 조제',buy:'일반약 구매',urgent:'긴급 확인 필요',bye:'대화 종료',unknown:'다시 질문 중'}[k]);say(texts[k],()=>{if(!on)return;if(k==='bye'||k==='urgent'||turns>=3){standby();return}if(k==='staff'||k==='rx'||k==='buy'){say('다른 도움이 필요하신가요?',listen)}else listen()})}
function listen(){if(!on)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status('Safari 음성 인식 미지원 · 약사 직접 응대');standby();return}cleanupSpeech();phase='listening';setMood('listening');let r=new SR;rec=r;r.lang='ko-KR';r.continuous=false;r.interimResults=false;let got=false,ended=false;r.onstart=()=>status('마이크 듣는 중 · 말씀하세요');r.onspeechstart=()=>status('고객 음성 감지');r.onresult=e=>{if(got)return;got=true;clearTimeout(listenTimeout);let t=e.results[0][0].transcript;status('인식: '+t);answer(t)};r.onerror=e=>{if(got||!on)return;ended=true;clearTimeout(listenTimeout);status('음성 인식 오류: '+e.error);say('음성을 듣지 못했어요. 약사님이 직접 도와드리겠습니다.',standby)};r.onend=()=>{ended=true;clearTimeout(listenTimeout);if(!got&&on&&phase==='listening'){say('말씀이 들리지 않았어요. 약사님이 도와드리겠습니다.',standby)}};try{r.start();listenTimeout=setTimeout(()=>{if(!got&&!ended&&on&&phase==='listening'){cleanupSpeech();say('말씀이 들리지 않았어요. 약사님이 도와드리겠습니다.',standby)}},9000)}catch(e){status('마이크 시작 실패: '+e.message);standby()}}
function greet(){if(!on||phase!=='idle')return;phase='speaking';motion=0;turns=0;lastGreeting=Date.now();label('손님 감지');say('안녕하세요. 어서 오세요. 무엇을 도와드릴까요?',listen)}
function scan(){if(!on)return;const v=$('video');if(!stream||stream.getVideoTracks().some(t=>t.readyState==='ended')){status('카메라 연결 종료 · 관리자 복구 필요');return}if(phase!=='idle'||v.readyState<2)return;try{let c=$('cv'),x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,64,48);let d=x.getImageData(0,0,64,48).data,now=[];for(let i=0;i<d.length;i+=16)now.push((d[i]+d[i+1]+d[i+2])/3);frames++;if(prev){let diff=0;for(let i=0;i<now.length;i++)diff+=Math.abs(now[i]-prev[i]);let score=diff/now.length;if(frames%12===0)$('status').textContent='카메라 ON · 움직임 '+score.toFixed(1);motion=score>6?motion+1:Math.max(0,motion-1);if(motion>=2&&Date.now()-armedAt>1500&&Date.now()-lastGreeting>12000)greet()}prev=now}catch(e){status('영상 처리 오류: '+e.message)}}
async function start(){if(on)return;if(!isSecureContext||!navigator.mediaDevices?.getUserMedia){status('HTTPS 및 카메라 API 필요');return}if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('운영 시작');u.lang='ko-KR';speechSynthesis.speak(u)}try{status('카메라 권한 요청');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=stream;await $('video').play();on=true;phase='idle';setMood('waiting');prev=null;motion=0;frames=0;armedAt=Date.now();timer=setInterval(scan,250);status('카메라 ON · 방문 대기')}catch(e){status('카메라 오류: '+e.name+' '+e.message)}}
function stop(){on=false;phase='stopped';setMood('waiting');clearInterval(timer);clearTimeout(voiceTimeout);cleanupSpeech();if(window.speechSynthesis)speechSynthesis.cancel();stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;label('운영 중지');status('관리자 중지')}
$('start').onclick=start;$('stop').onclick=stop;$('reset').onclick=()=>{stop();start()};$('voice').onclick=()=>say('안녕하세요. 어서 오세요. 무엇을 도와드릴까요?');$('mic').onclick=()=>{if(on){phase='listening';listen()}else status('먼저 운영을 시작하세요')};

</script></body></html>
